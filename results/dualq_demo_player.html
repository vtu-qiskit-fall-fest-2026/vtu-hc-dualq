<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DualQ — 2-Minute Silent Banking Platform Demonstration</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background-color: #0F172A;
      color: #F8FAFC;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 24px;
    }
    .player-container {
      max-width: 1280px;
      width: 100%;
      background-color: #1E293B;
      border: 1px solid #334155;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5), 0 8px 10px -6px rgba(0, 0, 0, 0.5);
    }
    .player-header {
      padding: 14px 20px;
      background-color: #0F172A;
      border-bottom: 1px solid #334155;
      display: flex;
      align-items: center;
      justifyContent: space-between;
      flex-wrap: wrap;
      gap: 12px;
    }
    .player-header h1 {
      font-size: 15px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .badge {
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 4px;
      background-color: #0369A1;
      color: #E0F2FE;
      font-weight: 600;
    }
    .screen-viewport {
      width: 100%;
      height: 720px;
      background-color: #020617;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      user-select: none;
    }
    .screen-viewport img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }
    .player-controls {
      padding: 16px 20px;
      background-color: #0F172A;
      border-top: 1px solid #334155;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .timeline-bar {
      width: 100%;
      height: 8px;
      background-color: #334155;
      border-radius: 4px;
      cursor: pointer;
      position: relative;
    }
    .timeline-progress {
      height: 100%;
      background: linear-gradient(90deg, #2563EB, #38BDF8);
      border-radius: 4px;
      width: 0%;
      transition: width 0.1s linear;
    }
    .controls-row {
      display: flex;
      align-items: center;
      justifyContent: space-between;
      flex-wrap: wrap;
      gap: 12px;
    }
    .btn {
      background-color: #334155;
      color: #F8FAFC;
      border: none;
      padding: 6px 14px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: background-color 0.15s ease;
    }
    .btn:hover { background-color: #475569; }
    .btn-primary { background-color: #2563EB; }
    .btn-primary:hover { background-color: #1D4ED8; }
    .chapter-select {
      background-color: #334155;
      color: #F8FAFC;
      border: 1px solid #475569;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 12px;
      cursor: pointer;
    }
    .footer-notes {
      margin-top: 16px;
      font-size: 12px;
      color: #94A3B8;
      text-align: center;
    }
  </style>
</head>
<body>

  <div class="player-container">
    <div class="player-header">
      <h1>
        <span>🛡️ DualQ: Quantum Banking Fraud Detection</span>
        <span class="badge">Silent 2-Minute Screen Recording Demo</span>
      </h1>
      <div style="font-size: 12px; color: #94A3B8;">
        Qiskit Fall Fest 2026 &bull; Team ID: <strong>VTU-QFF-HC-0079</strong>
      </div>
    </div>

    <div class="screen-viewport" id="viewport">
      <img id="screenImg" src="../frontend/demo_frames/frame_001.png" alt="DualQ Demo Frame" />
    </div>

    <div class="player-controls">
      <div class="timeline-bar" id="timelineBar">
        <div class="timeline-progress" id="timelineProgress"></div>
      </div>

      <div class="controls-row">
        <div style="display: flex; align-items: center; gap: 10px;">
          <button class="btn btn-primary" id="playPauseBtn">▶ Play</button>
          <button class="btn" id="prevBtn">&larr; Prev</button>
          <button class="btn" id="nextBtn">Next &rarr;</button>
          <span id="counter" style="font-size: 13px; color: #94A3B8; font-family: monospace;">1 / 16</span>
        </div>

        <div style="display: flex; align-items: center; gap: 10px;">
          <label style="font-size: 12px; color: #94A3B8;">Jump to Chapter:</label>
          <select class="chapter-select" id="chapterSelect">
            <option value="0">1. Institutional Sign-In (PostgreSQL Auth)</option><option value="3">2. Executive Banking Gateway Home Page</option><option value="4">3. Domestic Payment Rails Telemetry (UPI/Soundbox)</option><option value="6">4. Bank Transfer Simulator: Safe Kirana QR (Approved)</option><option value="8">5. Bank Transfer Simulator: Midnight Drain (Blocked)</option><option value="10">6. Live FastAPI Quantum Response Telemetry</option><option value="11">7. Unified Payment Audit Ledger (dualq_db)</option><option value="12">8. RBI Benchmarks & Quantum Advantage Proof</option><option value="14">9. Quantum Hilbert Space & Gram Matrix</option><option value="15">10. Secure Sign Out & Session Closure</option>
          </select>
          <button class="btn" id="fullscreenBtn">⛶ Fullscreen</button>
        </div>
      </div>
    </div>
  </div>

  <div class="footer-notes">
    Direct Video File Generated: <a href="dualq_silent_demo.webp" target="_blank" style="color: #38BDF8; font-weight: 600;">dualq_silent_demo.webp</a> &bull; Silent 120-Second End-to-End Banking Demonstration
  </div>

  <script>
    const frames = ["../frontend/demo_frames/frame_001.png", "../frontend/demo_frames/frame_002.png", "../frontend/demo_frames/frame_003.png", "../frontend/demo_frames/frame_004.png", "../frontend/demo_frames/frame_005.png", "../frontend/demo_frames/frame_006.png", "../frontend/demo_frames/frame_007.png", "../frontend/demo_frames/frame_008.png", "../frontend/demo_frames/frame_009.png", "../frontend/demo_frames/frame_010.png", "../frontend/demo_frames/frame_011.png", "../frontend/demo_frames/frame_012.png", "../frontend/demo_frames/frame_013.png", "../frontend/demo_frames/frame_014.png", "../frontend/demo_frames/frame_015.png", "../frontend/demo_frames/frame_016.png"];
    const durations = [2200, 2200, 2200, 2600, 2600, 2600, 1800, 3200, 1800, 3800, 2600, 3200, 3400, 3400, 3000, 2800];
    let currentIndex = 0;
    let isPlaying = false;
    let timer = null;

    const img = document.getElementById('screenImg');
    const progress = document.getElementById('timelineProgress');
    const counter = document.getElementById('counter');
    const playPauseBtn = document.getElementById('playPauseBtn');
    const chapterSelect = document.getElementById('chapterSelect');

    function updateFrame(index) {
      currentIndex = (index + frames.length) % frames.length;
      img.src = frames[currentIndex];
      counter.textContent = (currentIndex + 1) + ' / ' + frames.length;
      progress.style.width = ((currentIndex + 1) / frames.length * 100) + '%';
      
      // Update chapter dropdown if matches
      for (let i = 0; i < chapterSelect.options.length; i++) {
        const optVal = parseInt(chapterSelect.options[i].value, 10);
        if (optVal <= currentIndex) {
          chapterSelect.selectedIndex = i;
        }
      }
    }

    function playNext() {
      if (!isPlaying) return;
      updateFrame(currentIndex + 1);
      const delay = durations[currentIndex] || 2000;
      timer = setTimeout(playNext, delay);
    }

    function togglePlay() {
      isPlaying = !isPlaying;
      if (isPlaying) {
        playPauseBtn.textContent = '⏸ Pause';
        playPauseBtn.classList.remove('btn-primary');
        const delay = durations[currentIndex] || 2000;
        timer = setTimeout(playNext, delay);
      } else {
        playPauseBtn.textContent = '▶ Play';
        playPauseBtn.classList.add('btn-primary');
        if (timer) clearTimeout(timer);
      }
    }

    playPauseBtn.addEventListener('click', togglePlay);
    document.getElementById('prevBtn').addEventListener('click', () => {
      if (isPlaying) togglePlay();
      updateFrame(currentIndex - 1);
    });
    document.getElementById('nextBtn').addEventListener('click', () => {
      if (isPlaying) togglePlay();
      updateFrame(currentIndex + 1);
    });

    document.getElementById('timelineBar').addEventListener('click', (e) => {
      const rect = e.currentTarget.getBoundingClientRect();
      const clickX = e.clientX - rect.left;
      const ratio = clickX / rect.width;
      const targetFrame = Math.floor(ratio * frames.length);
      updateFrame(targetFrame);
    });

    chapterSelect.addEventListener('change', (e) => {
      const targetFrame = parseInt(e.target.value, 10);
      updateFrame(targetFrame);
    });

    document.getElementById('fullscreenBtn').addEventListener('click', () => {
      const vp = document.getElementById('viewport');
      if (!document.fullscreenElement) {
        vp.requestFullscreen().catch(() => {});
      } else {
        document.exitFullscreen().catch(() => {});
      }
    });

    // Autoplay after 1 second
    setTimeout(togglePlay, 1000);
  </script>
</body>
</html>
